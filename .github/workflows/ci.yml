name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          GEMINI_API_KEY: dummy
          POCKETBASE_URL: https://placeholder.example.com
          POCKETBASE_ADMIN_EMAIL: ci@example.com
          POCKETBASE_ADMIN_PASSWORD: ci
          WIKI_GITHUB_OWNER: dummy
          WIKI_GITHUB_REPO: dummy
          WIKI_GITHUB_PAT: dummy
